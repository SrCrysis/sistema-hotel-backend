<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada</title>
    <style>
        :root {
            --bg: #12262a;
            --accent: #c19a55;
            --text: #f2ede4;
            --muted: #9fb0ac;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            max-width: 480px;
            text-align: center;
        }
        .code {
            font-family: Georgia, "Iowan Old Style", serif;
            font-size: 4rem;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.8rem;
        }
        h1 {
            font-family: Georgia, "Iowan Old Style", serif;
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }
        p {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.6rem;
        }
        a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
            font-size: 0.95rem;
        }
        a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>Esta habitación no existe</h1>
        <p>La página que buscas no se encuentra disponible en el Sistema de Hotel.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
