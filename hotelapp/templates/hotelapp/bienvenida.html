<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Hotel</title>
    <style>
        :root {
            --bg: #12262a;
            --panel: #17323738;
            --accent: #c19a55;
            --text: #f2ede4;
            --muted: #9fb0ac;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            max-width: 540px;
            text-align: center;
        }
        .eyebrow {
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-family: Georgia, "Iowan Old Style", serif;
            font-size: 2.6rem;
            font-weight: 400;
            line-height: 1.15;
            margin-bottom: 1.2rem;
        }
        .divider {
            width: 48px;
            height: 2px;
            background: var(--accent);
            margin: 0 auto 1.4rem auto;
        }
        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="eyebrow">Bienvenido</div>
        <h1>Sistema de Hotel</h1>
        <div class="divider"></div>
        <p>Backend del proyecto Sistema de Hotel, desarrollado con Python y Django como base técnica para la gestión de la reserva y estadía de huéspedes.</p>
    </div>
</body>
</html>
